CONFIG_GPIO=y
CONFIG_LOG=y
CONFIG_SERIAL=y
CONFIG_UART_ASYNC_API=y

CONFIG_I2C=y
CONFIG_I2C_NRFX=y
CONFIG_PINCTRL=y

CONFIG_SENSOR=y
# myaccel 节点用的是 "st,lis2dh-common"（main.c 直接走 I2C 读写寄存器），
# 而 CONFIG_LIS2DH 依赖 DT_HAS_ST_LIS2DH_ENABLED（即 compatible = "st,lis2dh"），
# 依赖不满足会被 Kconfig 当成 warning 并中止构建，所以不要在这里打开 LIS2DH。
# 若以后改用 Zephyr sensor API，把 overlay 里的 compatible 改成 "st,lis2dh"。

CONFIG_DISPLAY=y
CONFIG_SSD1306=y
CONFIG_CHARACTER_FRAMEBUFFER=y
CONFIG_CHARACTER_FRAMEBUFFER_USE_DEFAULT_FONTS=y

CONFIG_HEAP_MEM_POOL_SIZE=4096
